<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>额度与上下文监控</title>
  <style>
    /* ==========================================================================
       Apple Liquid Glass Design System v2.2 (Dual 5h + Weekly Rings)
       ========================================================================== */
    :root {
      --apple-blue: #007AFF;
      --apple-green: #34C759;
      --apple-orange: #FF9F0A;
      --apple-red: #FF3B30;
      --apple-indigo: #5856D6;
      --apple-teal: #30B0C7;

      --canvas-bg: #F2F4F8;
      --orb-1: rgba(0, 122, 255, 0.16);
      --orb-2: rgba(52, 199, 89, 0.13);
      --orb-3: rgba(88, 86, 214, 0.12);

      --glass-surface: rgba(255, 255, 255, 0.62);
      --glass-surface-elevated: rgba(255, 255, 255, 0.80);
      --glass-surface-subtle: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.74);
      --glass-hairline: rgba(15, 23, 42, 0.07);
      --glass-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.86),
        0 8px 24px -6px rgba(15, 23, 42, 0.07),
        0 2px 6px -1px rgba(15, 23, 42, 0.04);

      --seg-track: rgba(118, 118, 128, 0.12);
      --seg-thumb: rgba(255, 255, 255, 0.95);
      --seg-thumb-shadow: 0 2px 6px rgba(0, 0, 0, 0.08), 0 0.5px 1px rgba(0, 0, 0, 0.06);

      --ink-primary: #1D1D1F;
      --ink-secondary: rgba(29, 29, 31, 0.66);
      --ink-tertiary: rgba(29, 29, 31, 0.44);
      --track-bg: rgba(120, 120, 128, 0.15);

      --pill-blue-bg: rgba(0, 122, 255, 0.12);
      --pill-green-bg: rgba(52, 199, 89, 0.13);
      --pill-orange-bg: rgba(255, 159, 10, 0.15);
      --pill-red-bg: rgba(255, 59, 48, 0.13);
      --pill-indigo-bg: rgba(88, 86, 214, 0.13);
      --pill-teal-bg: rgba(48, 176, 199, 0.14);

      --font-sans-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei UI", sans-serif;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] {
      --apple-blue: #0A84FF;
      --apple-green: #30D158;
      --apple-orange: #FF9F0A;
      --apple-red: #FF453A;
      --apple-indigo: #5E5CE6;
      --apple-teal: #64D2FF;

      --canvas-bg: #0E1015;
      --orb-1: rgba(10, 132, 255, 0.20);
      --orb-2: rgba(48, 209, 88, 0.13);
      --orb-3: rgba(94, 92, 230, 0.17);

      --glass-surface: rgba(30, 33, 42, 0.56);
      --glass-surface-elevated: rgba(42, 46, 58, 0.70);
      --glass-surface-subtle: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.13);
      --glass-hairline: rgba(255, 255, 255, 0.08);
      --glass-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 12px 30px -8px rgba(0, 0, 0, 0.42),
        0 2px 6px rgba(0, 0, 0, 0.24);

      --seg-track: rgba(118, 118, 128, 0.26);
      --seg-thumb: rgba(99, 99, 106, 0.76);
      --seg-thumb-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.18), 0 2px 6px rgba(0, 0, 0, 0.3);

      --ink-primary: #F5F5F7;
      --ink-secondary: rgba(245, 245, 247, 0.68);
      --ink-tertiary: rgba(245, 245, 247, 0.44);
      --track-bg: rgba(120, 120, 128, 0.28);

      --pill-blue-bg: rgba(10, 132, 255, 0.20);
      --pill-green-bg: rgba(48, 209, 88, 0.18);
      --pill-orange-bg: rgba(255, 159, 10, 0.20);
      --pill-red-bg: rgba(255, 69, 58, 0.20);
      --pill-indigo-bg: rgba(94, 92, 230, 0.22);
      --pill-teal-bg: rgba(100, 210, 255, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --apple-blue: #0A84FF;
        --apple-green: #30D158;
        --apple-orange: #FF9F0A;
        --apple-red: #FF453A;
        --apple-indigo: #5E5CE6;
        --apple-teal: #64D2FF;
        --canvas-bg: #0E1015;
        --orb-1: rgba(10, 132, 255, 0.20);
        --orb-2: rgba(48, 209, 88, 0.13);
        --orb-3: rgba(94, 92, 230, 0.17);
        --glass-surface: rgba(30, 33, 42, 0.56);
        --glass-surface-elevated: rgba(42, 46, 58, 0.70);
        --glass-surface-subtle: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.13);
        --glass-hairline: rgba(255, 255, 255, 0.08);
        --glass-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 12px 30px -8px rgba(0, 0, 0, 0.42),
          0 2px 6px rgba(0, 0, 0, 0.24);
        --seg-track: rgba(118, 118, 128, 0.26);
        --seg-thumb: rgba(99, 99, 106, 0.76);
        --seg-thumb-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.18), 0 2px 6px rgba(0, 0, 0, 0.3);
        --ink-primary: #F5F5F7;
        --ink-secondary: rgba(245, 245, 247, 0.68);
        --ink-tertiary: rgba(245, 245, 247, 0.44);
        --track-bg: rgba(120, 120, 128, 0.28);
        --pill-blue-bg: rgba(10, 132, 255, 0.20);
        --pill-green-bg: rgba(48, 209, 88, 0.18);
        --pill-orange-bg: rgba(255, 159, 10, 0.20);
        --pill-red-bg: rgba(255, 69, 58, 0.20);
        --pill-indigo-bg: rgba(94, 92, 230, 0.22);
        --pill-teal-bg: rgba(100, 210, 255, 0.18);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--canvas-bg);
      color: var(--ink-primary);
      font-family: var(--font-sans-apple);
      font-size: 12.5px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .ambient-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(52px); transform: translateZ(0); }
    .orb-1 { width: 240px; height: 240px; top: -60px; right: -50px; background: var(--orb-1); }
    .orb-2 { width: 220px; height: 220px; top: 150px; left: -70px; background: var(--orb-2); }
    .orb-3 { width: 200px; height: 200px; bottom: -40px; right: 10%; background: var(--orb-3); }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .glass {
      background: var(--glass-surface);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border: 1px solid var(--glass-border);
      outline: 0.5px solid var(--glass-hairline);
      box-shadow: var(--glass-shadow);
      border-radius: 18px;
    }

    .glass-sub {
      background: var(--glass-surface-subtle);
      border: 1px solid var(--glass-hairline);
      border-radius: 13px;
    }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 0; }
    .title-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .app-squircle {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(145deg, var(--apple-blue), var(--apple-teal));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 3px 10px rgba(0, 122, 255, 0.28);
      display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
    }
    .title-row { display: flex; align-items: center; gap: 6px; }
    .title-row h1 { font-size: 14px; font-weight: 650; letter-spacing: -0.015em; white-space: nowrap; }

    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 620; padding: 1.5px 7px;
      border-radius: 999px; white-space: nowrap; letter-spacing: -0.005em;
    }
    .pill-blue   { background: var(--pill-blue-bg); color: var(--apple-blue); }
    .pill-green  { background: var(--pill-green-bg); color: var(--apple-green); }
    .pill-orange { background: var(--pill-orange-bg); color: var(--apple-orange); }
    .pill-red    { background: var(--pill-red-bg); color: var(--apple-red); }
    .pill-indigo { background: var(--pill-indigo-bg); color: var(--apple-indigo); }
    .pill-teal   { background: var(--pill-teal-bg); color: var(--apple-teal); }

    .actions-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .glass-btn {
      height: 28px; padding: 0 10px; border-radius: 999px;
      border: 1px solid var(--glass-border); background: var(--glass-surface-elevated);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05); color: var(--ink-primary);
      font-family: inherit; font-size: 11.5px; font-weight: 560;
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      transition: transform 0.16s var(--spring), opacity 0.16s;
    }
    .glass-btn:hover:not(:disabled) { transform: translateY(-0.5px); }
    .glass-btn:active:not(:disabled) { transform: scale(0.96); }
    .glass-btn:disabled { opacity: 0.55; cursor: default; }
    .glass-btn.icon-only { width: 28px; padding: 0; justify-content: center; }

    .live-dot { width: 6.5px; height: 6.5px; border-radius: 50%; background: var(--apple-green); box-shadow: 0 0 6px var(--apple-green); }
    .live-dot.paused { background: var(--ink-tertiary); box-shadow: none; }
    .live-dot.running { animation: pulseGlow 1.4s ease-in-out infinite; background: var(--apple-blue); box-shadow: 0 0 8px var(--apple-blue); }
    @keyframes pulseGlow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.82); } }
    .spin { animation: spin 0.85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 3-Unit Live Capsule Strip */
    .capsule-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .capsule-unit {
      padding: 8px 9px; border-radius: 14px; display: flex; align-items: center; gap: 7px;
      cursor: pointer; transition: transform 0.16s var(--spring), border-color 0.18s;
      text-align: left; font-family: inherit; color: inherit;
    }
    .capsule-unit:hover { transform: translateY(-1px); }
    .capsule-unit.active-unit {
      border-color: var(--apple-blue);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 0 0 1px var(--pill-blue-bg);
    }
    .mini-ring { width: 24px; height: 24px; flex-shrink: 0; }
    .capsule-txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .capsule-lbl { font-size: 9.5px; color: var(--ink-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .capsule-val {
      font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Segmented Controls */
    .segmented {
      display: grid; grid-template-columns: repeat(4, 1fr); padding: 3px;
      border-radius: 11px; background: var(--seg-track);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); gap: 2px;
    }
    .seg-btn {
      height: 26px; border: none; border-radius: 8.5px; background: transparent;
      color: var(--ink-secondary); font-family: inherit; font-size: 11.5px; font-weight: 560;
      cursor: pointer; transition: all 0.2s var(--spring); white-space: nowrap;
    }
    .seg-btn.active { background: var(--seg-thumb); color: var(--ink-primary); font-weight: 650; box-shadow: var(--seg-thumb-shadow); }

    .mini-seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--seg-track); gap: 2px; }
    .mini-seg-btn {
      border: none; background: transparent; color: var(--ink-secondary); font-family: inherit;
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 6px; cursor: pointer;
    }
    .mini-seg-btn.active { background: var(--seg-thumb); color: var(--ink-primary); box-shadow: var(--seg-thumb-shadow); }

    /* Time Strip */
    .time-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .time-cell { padding: 7px 8px; text-align: center; display: flex; flex-direction: column; gap: 1px; }
    .time-lbl { font-size: 9.5px; color: var(--ink-tertiary); }
    .time-val { font-size: 11.5px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Alerts */
    .alert-glass {
      padding: 9px 12px; border-radius: 13px; display: flex; align-items: center; gap: 8px;
      font-size: 11.5px; font-weight: 540; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .alert-glass.warn { background: var(--pill-orange-bg); color: var(--apple-orange); border: 1px solid rgba(255, 159, 10, 0.28); }
    .alert-glass.danger { background: var(--pill-red-bg); color: var(--apple-red); border: 1px solid rgba(255, 59, 48, 0.28); }

    /* Hero Card */
    .hero-card { padding: 13px; display: grid; grid-template-columns: 118px 1fr; gap: 13px; align-items: center; }
    @media (max-width: 310px) { .hero-card { grid-template-columns: 1fr; justify-items: center; } }
    .ring-box { position: relative; width: 116px; height: 116px; display: flex; align-items: center; justify-content: center; }
    .ring-svg { width: 116px; height: 116px; overflow: visible; }
    .ring-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; pointer-events: none;
    }
    .ring-pct { font-size: 21px; font-weight: 750; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; line-height: 1.02; }
    .ring-cap { font-size: 9.5px; color: var(--ink-secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }

    .hero-right { display: flex; flex-direction: column; gap: 7px; min-width: 0; width: 100%; }
    .hero-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .hero-pool-title { font-size: 13px; font-weight: 660; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .kpi-mini { padding: 6.5px 8.5px; display: flex; flex-direction: column; gap: 1px; }
    .kpi-mini-lbl { font-size: 9.5px; color: var(--ink-tertiary); display: flex; align-items: center; gap: 4px; }
    .kpi-mini-val { font-size: 12px; font-weight: 660; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Section & Dual-Window Pool Cards */
    .section-card { padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; }
    .sec-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .sec-title { font-size: 12px; font-weight: 650; color: var(--ink-secondary); }
    .sec-note { font-size: 10.5px; color: var(--ink-tertiary); }

    .pool-list { display: flex; flex-direction: column; gap: 10px; }
    .pool-item {
      padding: 12px 12px; display: flex; flex-direction: column; gap: 9px;
      cursor: pointer; transition: border-color 0.18s, box-shadow 0.18s;
    }
    .pool-item.focused-pool {
      border-color: var(--apple-blue);
      box-shadow: inset 0 0 0 0.5px var(--apple-blue);
    }
    .pool-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .pool-title-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .glow-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .pool-title { font-size: 13px; font-weight: 660; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .windows-stack { display: flex; flex-direction: column; gap: 8px; }
    .win-block {
      padding: 8px 10px; border-radius: 10px;
      background: var(--glass-surface-elevated);
      border: 0.5px solid var(--glass-hairline);
      display: flex; flex-direction: column; gap: 5px;
    }
    .win-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .win-name { font-size: 11.5px; font-weight: 620; color: var(--ink-primary); display: flex; align-items: center; gap: 5px; }
    .win-pct-group { display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
    .win-pct-main { font-size: 14.5px; font-weight: 740; letter-spacing: -0.02em; }
    .win-pct-exact { font-size: 10px; color: var(--ink-tertiary); }

    .quota-bar-track { height: 6.5px; border-radius: 999px; background: var(--track-bg); overflow: hidden; }
    .quota-bar-fill { height: 100%; border-radius: 999px; transition: width 0.6s var(--spring); }
    .win-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 10.5px; color: var(--ink-secondary); }
    .mono-num { font-variant-numeric: tabular-nums; font-weight: 620; color: var(--ink-primary); }

    .link-btn { background: none; border: none; color: var(--apple-blue); font-family: inherit; font-size: 11px; font-weight: 560; cursor: pointer; padding: 1px 4px; border-radius: 5px; }
    .link-btn:hover { background: var(--pill-blue-bg); }

    .chips-wrap { padding-top: 8px; border-top: 0.5px solid var(--glass-hairline); display: flex; flex-wrap: wrap; gap: 5px; }
    .m-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 8px; background: var(--glass-surface-elevated); border: 0.5px solid var(--glass-hairline); font-size: 11px; color: var(--ink-secondary); }
    .m-chip-tag { font-size: 9.5px; font-weight: 650; padding: 0 5px; border-radius: 999px; background: var(--pill-blue-bg); color: var(--apple-blue); }
    .m-chip-tag.warn { background: var(--pill-orange-bg); color: var(--apple-orange); }

    /* Session & Context */
    .session-select-wrap { display: flex; align-items: center; gap: 6px; width: 100%; }
    .glass-select {
      flex: 1; min-width: 0; height: 30px; padding: 0 10px; border-radius: 10px;
      border: 1px solid var(--glass-hairline); background: var(--glass-surface-elevated);
      color: var(--ink-primary); font-family: inherit; font-size: 11.5px; font-weight: 560; outline: none;
    }
    .stacked-bar { height: 9px; width: 100%; border-radius: 999px; background: var(--track-bg); overflow: hidden; display: flex; gap: 1.5px; }
    .stacked-seg { height: 100%; transition: width 0.5s var(--spring); }
    .comp-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .comp-cell { padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; }

    /* Credits & Speed */
    .credits-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .speed-tri-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .credit-box { padding: 10px 11px; display: flex; flex-direction: column; gap: 3px; }
    .credit-head { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--ink-tertiary); }
    .credit-val { font-size: 15.5px; font-weight: 720; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .credit-sub { font-size: 10px; color: var(--ink-tertiary); font-variant-numeric: tabular-nums; }

    .chart-frame { height: 148px; padding: 10px 8px 6px; position: relative; }
    .chart-svg { width: 100%; height: 100%; overflow: visible; }
    .chart-empty { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 14px; color: var(--ink-tertiary); font-size: 11.5px; }
    .legend-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--ink-secondary); }
    .legend-chip { display: inline-flex; align-items: center; gap: 5px; }
    .legend-line { width: 10px; height: 3px; border-radius: 2px; }

    .models-table { display: flex; flex-direction: column; gap: 6px; }
    .model-row { padding: 8px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .model-row-left { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .model-row-name { font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .model-row-desc { font-size: 10px; color: var(--ink-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .footer-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 4px 0; font-size: 10.5px; color: var(--ink-tertiary); flex-wrap: wrap; }

    .tone-good { color: var(--apple-green); }
    .tone-warn { color: var(--apple-orange); }
    .tone-bad  { color: var(--apple-red); }
    .tone-blue { color: var(--apple-blue); }
    .tone-teal { color: var(--apple-teal); }

    .fill-good { background: linear-gradient(90deg, #34C759, #30D158); }
    .fill-warn { background: linear-gradient(90deg, #FF9F0A, #FFB340); }
    .fill-bad  { background: linear-gradient(90deg, #FF3B30, #FF6961); }
    .fill-teal { background: linear-gradient(90deg, #30B0C7, #64D2FF); }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="shell" id="root">
    <div class="glass section-card">
      <div class="sec-note">正在同步官方双窗口额度与当前会话…</div>
    </div>
  </div>

  <script type="module">
    const RUNTIME_MODE = "__RUNTIME_MODE__";
    /*__INLINE_EXT_APPS_SDK__*/

    const state = {
      data: null,
      loading: true,
      refreshing: false,
      autoRefresh: true,
      autoSecondsLeft: 15,
      activeTab: "quota", // quota | context | speed | trend
      focusedPoolId: null, // null = follow current session's active model pool
      contextBudgetMode: "auto",
      selectedConversationId: null,
      showAllModels: false,
      expandedPools: new Set(),
      error: null,
    };

    const SERIES_COLORS = ["#007AFF", "#34C759", "#FF9F0A", "#5856D6", "#FF2D55"];
    let mcpApp = null;

    function quotaTone(pct) {
      if (pct >= 60) return "good";
      if (pct >= 25) return "warn";
      return "bad";
    }

    function quotaColor(pct) {
      if (pct >= 60) return "var(--apple-green)";
      if (pct >= 25) return "var(--apple-orange)";
      return "var(--apple-red)";
    }

    function ctxColor(usedPct) {
      if (usedPct < 60) return "var(--apple-blue)";
      if (usedPct < 85) return "var(--apple-orange)";
      return "var(--apple-red)";
    }

    function pacePillClass(status) {
      if (status === "surplus" || status === "idle") return "pill-green";
      if (status === "fast") return "pill-orange";
      return "pill-blue";
    }

    function fmtIntPct(pct) {
      if (typeof pct !== "number" || Number.isNaN(pct)) return "--";
      return `${Math.round(pct)}%`;
    }

    function fmtExactPct(pct) {
      if (typeof pct !== "number" || Number.isNaN(pct)) return "--";
      return `${pct.toFixed(1)}%`;
    }

    function fmtCompactTokens(n) {
      if (typeof n !== "number" || Number.isNaN(n)) return "--";
      if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(2)}M`;
      if (n >= 1_000) return `${(n / 1_000).toFixed(1)}K`;
      return String(n);
    }

    function fmtClock(iso) {
      if (!iso) return "--:--:--";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "--:--:--";
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }

    function fmtResetAt(iso) {
      if (!iso) return "未知";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return `今日 ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false })}`;
      }
      return d.toLocaleString([], { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
    }

    // Matches official View Usage human countdown style (`6d 18h`, `4h 41m`, `<1m`) + live seconds when < 1h
    function fmtHumanCountdown(iso) {
      if (!iso) return "--";
      const target = new Date(iso).getTime();
      if (Number.isNaN(target)) return "--";
      const diff = Math.max(0, Math.floor((target - Date.now()) / 1000));
      if (diff === 0) return "即将重置";
      if (diff < 60) return `<1m (${diff}s)`;
      const d = Math.floor(diff / 86400);
      const h = Math.floor((diff % 86400) / 3600);
      const m = Math.floor((diff % 3600) / 60);
      const s = diff % 60;
      const pad = (n) => String(n).padStart(2, "0");
      if (d > 0) return `${d}d ${h}h`;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m ${pad(s)}s`;
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function polarPoint(cx, cy, r, pct) {
      const clamped = Math.max(0, Math.min(100, pct));
      const angleRad = ((clamped / 100) * 360 - 90) * (Math.PI / 180);
      return { x: cx + r * Math.cos(angleRad), y: cy + r * Math.sin(angleRad) };
    }

    function getEffectiveContextLimit(ctx) {
      if (state.contextBudgetMode === "200k") return 200_000;
      if (state.contextBudgetMode === "1m") return 1_000_000;
      return ctx?.autoLimitTokens || 1_000_000;
    }

    function renderMiniDualRingSvg(pctOuter, pctInner, outerColor) {
      const r1 = 9.2, r2 = 5.6;
      const c1 = 2 * Math.PI * r1, c2 = 2 * Math.PI * r2;
      const o1 = c1 * (1 - Math.max(0, Math.min(100, pctOuter ?? 100)) / 100);
      const o2 = c2 * (1 - Math.max(0, Math.min(100, pctInner ?? pctOuter ?? 100)) / 100);
      return `
        <svg class="mini-ring" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="${r1}" fill="none" stroke="var(--track-bg)" stroke-width="2.4" />
          <circle cx="12" cy="12" r="${r1}" fill="none" stroke="${outerColor}" stroke-width="2.4"
            stroke-linecap="round" transform="rotate(-90 12 12)"
            stroke-dasharray="${c1.toFixed(2)}" stroke-dashoffset="${o1.toFixed(2)}" />
          <circle cx="12" cy="12" r="${r2}" fill="none" stroke="var(--track-bg)" stroke-width="2.2" />
          <circle cx="12" cy="12" r="${r2}" fill="none" stroke="var(--apple-teal)" stroke-width="2.2"
            stroke-linecap="round" transform="rotate(-90 12 12)"
            stroke-dasharray="${c2.toFixed(2)}" stroke-dashoffset="${o2.toFixed(2)}" />
        </svg>
      `;
    }

    function renderMiniSingleRingSvg(pct, strokeColor) {
      const r = 8.8;
      const circ = 2 * Math.PI * r;
      const off = circ * (1 - Math.max(0, Math.min(100, pct || 0)) / 100);
      return `
        <svg class="mini-ring" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="${r}" fill="none" stroke="var(--track-bg)" stroke-width="2.6" />
          <circle cx="12" cy="12" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="2.6"
            stroke-linecap="round" transform="rotate(-90 12 12)"
            stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" />
        </svg>
      `;
    }

    // Apple Watch Activity Dual Concentric Rings: Outer = 5h Limit, Inner = Weekly Limit
    function renderDualConcentricQuotaRings(pool) {
      const pct5h = pool ? pool.remainingPercent : 100;
      const disp5h = pool?.displayPercent != null ? pool.displayPercent : Math.round(pct5h);
      const pctWeekly = pool?.weeklyRemainingPercent != null ? pool.weeklyRemainingPercent : null;
      const dispWeekly = pool?.weeklyDisplayPercent != null ? pool.weeklyDisplayPercent : null;
      const timeRem5h = pool?.pace?.timeRemainingPercent;

      const cx = 58, cy = 58;
      const rOuter = 48, rInner = 36;
      const cOuter = 2 * Math.PI * rOuter;
      const cInner = 2 * Math.PI * rInner;
      const offOuter = cOuter * (1 - Math.max(0, Math.min(100, pct5h)) / 100);
      const offInner = pctWeekly != null ? cInner * (1 - Math.max(0, Math.min(100, pctWeekly)) / 100) : 0;
      const tone = quotaTone(pct5h);

      let paceDotSvg = "";
      if (typeof timeRem5h === "number") {
        const pt = polarPoint(cx, cy, rOuter, timeRem5h);
        paceDotSvg = `
          <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.8"
            fill="var(--seg-thumb)" stroke="var(--apple-blue)" stroke-width="2">
            <title>5h 周期剩余时间基准：${timeRem5h.toFixed(1)}%</title>
          </circle>
        `;
      }

      const innerRingSvg = pctWeekly != null
        ? `
          <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="var(--track-bg)" stroke-width="7.5" />
          <circle cx="${cx}" cy="${cy}" r="${rInner}" fill="none" stroke="var(--apple-teal)" stroke-width="7.5"
            stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"
            stroke-dasharray="${cInner.toFixed(2)}" stroke-dashoffset="${offInner.toFixed(2)}"
            style="transition: stroke-dashoffset 0.65s var(--spring)" />
        `
        : "";

      return `
        <div class="ring-box" title="外环：5 小时限额 (${fmtExactPct(pct5h)}) ｜ 内环：每周限额 (${pctWeekly != null ? fmtExactPct(pctWeekly) : '--'})">
          <svg class="ring-svg" viewBox="0 0 116 116">
            <circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="var(--track-bg)" stroke-width="8.5" />
            <circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="none" stroke="${quotaColor(pct5h)}" stroke-width="8.5"
              stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${cOuter.toFixed(2)}" stroke-dashoffset="${offOuter.toFixed(2)}"
              style="transition: stroke-dashoffset 0.65s var(--spring)" />
            ${innerRingSvg}
            ${paceDotSvg}
          </svg>
          <div class="ring-center">
            <div class="ring-pct tone-${tone}">${disp5h}%</div>
            <div class="ring-cap">${dispWeekly != null ? `周 ${dispWeekly}%` : "5h 余量"}</div>
          </div>
        </div>
      `;
    }

    function renderContextRing(usedPct, activeTokens) {
      const cx = 58, cy = 58, r = 45;
      const circ = 2 * Math.PI * r;
      const clamped = Math.max(0, Math.min(100, usedPct));
      const offset = circ * (1 - clamped / 100);
      const color = ctxColor(clamped);

      return `
        <div class="ring-box">
          <svg class="ring-svg" viewBox="0 0 116 116">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--track-bg)" stroke-width="9.5" />
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="9.5"
              stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
              style="transition: stroke-dashoffset 0.65s var(--spring)" />
          </svg>
          <div class="ring-center">
            <div class="ring-pct" style="font-size:19px;color:${color}">${fmtCompactTokens(activeTokens)}</div>
            <div class="ring-cap">占用 ${clamped.toFixed(1)}%</div>
          </div>
        </div>
      `;
    }

    function renderPoolCard(pool, isFocused) {
      const expanded = state.expandedPools.has(pool.id);
      const windows = pool.windows || [];

      const windowsHtml = windows
        .map((w) => {
          const isWeekly = w.window === "weekly";
          const tone = quotaTone(w.remainingPercent);
          const barClass = isWeekly && w.remainingPercent >= 60 ? "fill-teal" : `fill-${tone}`;
          const numClass = isWeekly && w.remainingPercent >= 60 ? "tone-teal" : `tone-${tone}`;
          const dotColor = isWeekly ? "var(--apple-teal)" : quotaColor(w.remainingPercent);

          return `
            <div class="win-block">
              <div class="win-head">
                <span class="win-name">
                  <span style="width:6px;height:6px;border-radius:50%;background:${dotColor}"></span>
                  <span>${esc(w.label)}</span>
                </span>
                <div class="win-pct-group">
                  <span class="win-pct-main ${numClass}">${w.displayPercent}% left</span>
                  <span class="win-pct-exact">(${fmtExactPct(w.remainingPercent)})</span>
                </div>
              </div>
              <div class="quota-bar-track">
                <div class="quota-bar-fill ${barClass}" style="width:${Math.max(0, Math.min(100, w.remainingPercent))}%"></div>
              </div>
              <div class="win-foot">
                <span>重置剩余 <span class="mono-num" data-countdown-iso="${esc(w.resetTime || "")}">${fmtHumanCountdown(w.resetTime)}</span></span>
                <span style="color:var(--ink-tertiary)">${esc(fmtResetAt(w.resetTime))}</span>
              </div>
            </div>
          `;
        })
        .join("");

      const chipsHtml = expanded
        ? `
          <div class="chips-wrap">
            ${(pool.models || [])
              .map((m) => {
                const warn = m.tagTitle && m.tagTitle.toLowerCase().includes("leaving");
                return `
                  <span class="m-chip">
                    <span>${esc(m.label)}</span>
                    ${m.tagTitle ? `<span class="m-chip-tag ${warn ? "warn" : ""}">${esc(m.tagTitle)}</span>` : ""}
                  </span>
                `;
              })
              .join("")}
          </div>
        `
        : "";

      return `
        <div class="glass-sub pool-item ${isFocused ? "focused-pool" : ""}" data-focus-pool="${esc(pool.id)}">
          <div class="pool-row-top">
            <div class="pool-title-group">
              <span class="glow-dot" style="background:${quotaColor(pool.effectiveRemainingPercent)};box-shadow:0 0 8px ${quotaColor(pool.effectiveRemainingPercent)}"></span>
              <span class="pool-title">${esc(pool.name)}</span>
              ${pool.isCurrentSessionPool ? `<span class="pill pill-blue">● 当前会话</span>` : ""}
            </div>
            <button class="link-btn" data-toggle-pool="${esc(pool.id)}" type="button">
              ${expanded ? "收起模型 ▲" : `${(pool.models || []).length} 个模型 ▼`}
            </button>
          </div>

          <div class="windows-stack">
            ${windowsHtml}
          </div>

          ${chipsHtml}
        </div>
      `;
    }

    function renderContextTab(sess) {
      if (!sess || !sess.available) {
        return `
          <div class="glass section-card">
            <div class="sec-note">暂无可读取的本地活跃会话日志，发送一条消息后将自动采集上下文用量。</div>
          </div>
        `;
      }

      const ctx = sess.context || {};
      const tot = sess.totals || {};
      const recent = sess.recentSessions || [];
      const limit = getEffectiveContextLimit(ctx);
      const active = ctx.activeTokens || 0;
      const usedPct = limit > 0 ? Math.min(100, (active / limit) * 100) : 0;
      const remTokens = Math.max(0, limit - active);
      const isRunning = sess.runState === "RUN_STATE_RUNNING";

      const cacheTok = ctx.cacheReadTokens || 0;
      const freshTok = ctx.freshInputTokens || 0;
      const outTok = ctx.latestOutputTokens || 0;
      const sumParts = Math.max(1, cacheTok + freshTok + outTok);
      const wCache = (cacheTok / sumParts) * 100;
      const wFresh = (freshTok / sumParts) * 100;
      const wOut = (outTok / sumParts) * 100;

      const optionsHtml = recent
        .map(
          (s) => `
          <option value="${esc(s.id)}" ${s.id === sess.conversationId ? "selected" : ""}>
            ${s.runState === "RUN_STATE_RUNNING" ? "● " : ""}${esc(s.title)}
          </option>
        `
        )
        .join("");

      return `
        <div class="glass section-card" style="gap:8px">
          <div class="sec-header">
            <span class="sec-title">目标监控会话</span>
            <span class="pill ${isRunning ? "pill-blue" : "pill-green"}">${isRunning ? "● 生成中" : "空闲"}</span>
          </div>
          <div class="session-select-wrap">
            <select class="glass-select" id="sel-session">
              ${optionsHtml}
            </select>
          </div>
          <div class="sec-note" style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap">
            <span>当前模型：<b style="color:var(--ink-primary)">${esc(sess.currentModel || "--")}</b></span>
            <span>缓存命中率：<b class="tone-good">${ctx.cacheHitPercent ?? 0}%</b></span>
          </div>
        </div>

        <div class="glass hero-card">
          ${renderContextRing(usedPct, active)}
          <div class="hero-right">
            <div class="hero-head">
              <span class="sec-title">窗口预算基准</span>
              <div class="mini-seg">
                <button class="mini-seg-btn ${state.contextBudgetMode === "auto" ? "active" : ""}" data-budget="auto">自动</button>
                <button class="mini-seg-btn ${state.contextBudgetMode === "200k" ? "active" : ""}" data-budget="200k">200K</button>
                <button class="mini-seg-btn ${state.contextBudgetMode === "1m" ? "active" : ""}" data-budget="1m">1M</button>
              </div>
            </div>
            <div class="hero-kpis">
              <div class="glass-sub kpi-mini">
                <span class="kpi-mini-lbl">已用上下文</span>
                <span class="kpi-mini-val">${active.toLocaleString()}</span>
              </div>
              <div class="glass-sub kpi-mini">
                <span class="kpi-mini-lbl">剩余空间</span>
                <span class="kpi-mini-val tone-good">${fmtCompactTokens(remTokens)}</span>
              </div>
              <div class="glass-sub kpi-mini">
                <span class="kpi-mini-lbl">窗口上限</span>
                <span class="kpi-mini-val">${fmtCompactTokens(limit)}</span>
              </div>
              <div class="glass-sub kpi-mini">
                <span class="kpi-mini-lbl">本步输出</span>
                <span class="kpi-mini-val">${outTok.toLocaleString()} tok</span>
              </div>
            </div>
          </div>
        </div>

        <div class="glass section-card">
          <div class="sec-header">
            <span class="sec-title">最新一步上下文构成</span>
            <span class="sec-note">总计 ${active.toLocaleString()} tokens</span>
          </div>
          <div class="stacked-bar">
            <div class="stacked-seg" style="width:${wCache.toFixed(1)}%;background:var(--apple-green)" title="缓存读取 ${cacheTok.toLocaleString()}"></div>
            <div class="stacked-seg" style="width:${wFresh.toFixed(1)}%;background:var(--apple-blue)" title="增量输入 ${freshTok.toLocaleString()}"></div>
            <div class="stacked-seg" style="width:${wOut.toFixed(1)}%;background:var(--apple-indigo)" title="模型输出 ${outTok.toLocaleString()}"></div>
          </div>
          <div class="comp-legend">
            <div class="glass-sub comp-cell">
              <span class="kpi-mini-lbl"><span style="color:var(--apple-green)">●</span> 缓存命中</span>
              <span class="kpi-mini-val">${fmtCompactTokens(cacheTok)}</span>
            </div>
            <div class="glass-sub comp-cell">
              <span class="kpi-mini-lbl"><span style="color:var(--apple-blue)">●</span> 增量输入</span>
              <span class="kpi-mini-val">${fmtCompactTokens(freshTok)}</span>
            </div>
            <div class="glass-sub comp-cell">
              <span class="kpi-mini-lbl"><span style="color:var(--apple-indigo)">●</span> 本步输出</span>
              <span class="kpi-mini-val">${fmtCompactTokens(outTok)}</span>
            </div>
          </div>
        </div>

        <div class="glass section-card">
          <div class="sec-header">
            <span class="sec-title">本会话累计统计</span>
            <span class="sec-note">自会话创建以来</span>
          </div>
          <div class="hero-kpis">
            <div class="glass-sub kpi-mini">
              <span class="kpi-mini-lbl">用户提问轮数</span>
              <span class="kpi-mini-val">${tot.userTurns ?? 0} 轮</span>
            </div>
            <div class="glass-sub kpi-mini">
              <span class="kpi-mini-lbl">模型推理步数</span>
              <span class="kpi-mini-val">${tot.modelSteps ?? 0} 步 · ${tot.toolCalls ?? 0} 工具</span>
            </div>
            <div class="glass-sub kpi-mini">
              <span class="kpi-mini-lbl">累计模型输出</span>
              <span class="kpi-mini-val">${fmtCompactTokens(tot.totalOutputTokens ?? 0)} tok</span>
            </div>
            <div class="glass-sub kpi-mini">
              <span class="kpi-mini-lbl">累计缓存复用</span>
              <span class="kpi-mini-val tone-good">${fmtCompactTokens(tot.totalCacheReadTokens ?? 0)} tok</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderSpeedTab(sess) {
      const spd = sess?.speed || {};
      const series = spd.series || [];

      let chartInner = "";
      if (series.length === 0) {
        chartInner = `<div class="chart-empty">当前会话尚无已完成测速样本，待模型完成下一步推理后自动生成。</div>`;
      } else {
        const W = 460, H = 132, padL = 32, padR = 8, padT = 12, padB = 20;
        const plotW = W - padL - padR, plotH = H - padT - padB;
        const maxTps = Math.max(60, ...series.map((s) => s.tokPerSec || 0)) * 1.12;
        const avg = spd.avgTokPerSec || 0;
        const yAvg = padT + (1 - avg / maxTps) * plotH;

        const barSlot = plotW / series.length;
        const barW = Math.min(22, Math.max(7, barSlot * 0.62));

        const barsSvg = series
          .map((s, i) => {
            const h = Math.max(4, (s.tokPerSec / maxTps) * plotH);
            const x = padL + i * barSlot + (barSlot - barW) / 2;
            const y = padT + plotH - h;
            const fill = i === series.length - 1 ? "var(--apple-blue)" : "rgba(0, 122, 255, 0.52)";
            return `
              <g>
                <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${fill}">
                  <title>Step #${s.stepIndex} (${esc(s.model)})\n速度：${s.tokPerSec} tok/s\n输出：${s.outputTokens} tok / 耗时 ${s.durationSec}s</title>
                </rect>
                <text x="${(x + barW / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="8.5" fill="var(--ink-tertiary)">#${s.stepIndex}</text>
              </g>
            `;
          })
          .join("");

        chartInner = `
          <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--glass-hairline)" />
            <text x="${padL - 4}" y="${padT + 3}" text-anchor="end" font-size="8.5" fill="var(--ink-tertiary)">${Math.round(maxTps)}</text>
            <line x1="${padL}" y1="${yAvg.toFixed(1)}" x2="${W - padR}" y2="${yAvg.toFixed(1)}" stroke="var(--apple-green)" stroke-dasharray="3,3" opacity="0.8" />
            <text x="${padL - 4}" y="${(yAvg + 3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--apple-green)">均</text>
            <line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="var(--glass-hairline)" />
            ${barsSvg}
          </svg>
        `;
      }

      const recentStepsHtml = [...series]
        .reverse()
        .slice(0, 6)
        .map(
          (s) => `
          <div class="glass-sub model-row">
            <div class="model-row-left">
              <div class="model-row-name">
                <span class="pill pill-indigo">Step #${s.stepIndex}</span>
                <span>${esc(s.model)}</span>
              </div>
              <div class="model-row-desc">输出 ${s.outputTokens.toLocaleString()} tok · 耗时 ${s.durationSec}s</div>
            </div>
            <span class="win-pct-main tone-blue" style="font-size:13.5px">${s.tokPerSec} <small style="font-size:10px;font-weight:500">tok/s</small></span>
          </div>
        `
        )
        .join("");

      return `
        <div class="speed-tri-grid">
          <div class="glass credit-box">
            <div class="credit-head"><span>最新速度</span></div>
            <div class="credit-val tone-blue">${spd.latestTokPerSec != null ? spd.latestTokPerSec : "--"}</div>
            <div class="credit-sub">tok/s${spd.latestDurationSec ? ` · ${spd.latestDurationSec}s` : ""}</div>
          </div>
          <div class="glass credit-box">
            <div class="credit-head"><span>平均速度</span></div>
            <div class="credit-val tone-good">${spd.avgTokPerSec != null ? spd.avgTokPerSec : "--"}</div>
            <div class="credit-sub">tok/s · ${spd.sampleCount || 0} 步</div>
          </div>
          <div class="glass credit-box">
            <div class="credit-head"><span>峰值速度</span></div>
            <div class="credit-val">${spd.peakTokPerSec != null ? spd.peakTokPerSec : "--"}</div>
            <div class="credit-sub">tok/s 最高记录</div>
          </div>
        </div>

        <div class="glass section-card">
          <div class="sec-header">
            <span class="sec-title">单步生成速度脉冲图</span>
            <span class="sec-note">剔除用户空闲等待</span>
          </div>
          <div class="glass-sub chart-frame">${chartInner}</div>
        </div>

        ${
          recentStepsHtml
            ? `
          <div class="glass section-card">
            <div class="sec-header">
              <span class="sec-title">最近推理步骤明细</span>
              <span class="sec-note">悬停柱体看详情</span>
            </div>
            <div class="models-table">${recentStepsHtml}</div>
          </div>
        `
            : ""
        }
      `;
    }

    function renderTrendAndModelsTab(history, models) {
      let trendChartHtml = "";
      if (!Array.isArray(history) || history.length < 2) {
        trendChartHtml = `
          <div class="glass-sub chart-frame">
            <div class="chart-empty">已采样 ${Array.isArray(history) ? history.length : 0} 次，保持开启自动刷新，额度变化后自动绘制趋势面积图。</div>
          </div>
        `;
      } else {
        const poolNames = [];
        history.forEach((pt) => {
          Object.keys(pt.pools || {}).forEach((k) => {
            if (!poolNames.includes(k)) poolNames.push(k);
          });
        });

        const W = 460, H = 132, padL = 30, padR = 8, padT = 8, padB = 18;
        const plotW = W - padL - padR, plotH = H - padT - padB;
        const xOf = (i) => padL + (i / (history.length - 1)) * plotW;
        const yOf = (v) => padT + (1 - Math.max(0, Math.min(100, v)) / 100) * plotH;

        const grids = [0, 50, 100]
          .map((v) => {
            const y = yOf(v).toFixed(1);
            return `
              <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--glass-hairline)" stroke-dasharray="${v === 50 ? '3,3' : ''}" />
              <text x="${padL - 5}" y="${Number(y) + 3}" text-anchor="end" font-size="9" fill="var(--ink-tertiary)">${v}%</text>
            `;
          })
          .join("");

        const series = poolNames
          .map((name, idx) => {
            const color = SERIES_COLORS[idx % SERIES_COLORS.length];
            const pts = [];
            history.forEach((h, i) => {
              const v = h.pools?.[name];
              if (typeof v === "number") pts.push([xOf(i), yOf(v)]);
            });
            if (pts.length < 2) return "";
            const dLine = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
            const dArea = `${dLine} L${pts[pts.length - 1][0].toFixed(1)},${(padT + plotH).toFixed(1)} L${pts[0][0].toFixed(1)},${(padT + plotH).toFixed(1)} Z`;
            const last = pts[pts.length - 1];
            return `
              <path d="${dArea}" fill="${color}" opacity="0.11" />
              <path d="${dLine}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="${color}" />
            `;
          })
          .join("");

        const tStart = fmtClock(history[0].t).slice(0, 5);
        const tEnd = fmtClock(history[history.length - 1].t).slice(0, 5);

        trendChartHtml = `
          <div class="glass-sub chart-frame">
            <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
              ${grids}
              ${series}
              <text x="${padL}" y="${H - 3}" font-size="9" fill="var(--ink-tertiary)">${esc(tStart)}</text>
              <text x="${W - padR}" y="${H - 3}" text-anchor="end" font-size="9" fill="var(--ink-tertiary)">${esc(tEnd)}</text>
            </svg>
          </div>
          <div class="legend-row">
            ${poolNames.map((n, i) => `<span class="legend-chip"><span class="legend-line" style="background:${SERIES_COLORS[i % SERIES_COLORS.length]}"></span>${esc(n)}</span>`).join("")}
          </div>
        `;
      }

      const modelsListHtml = state.showAllModels
        ? `
          <div class="models-table">
            ${models
              .map((m) => {
                const tone = quotaTone(m.remainingPercent);
                const warn = m.tagTitle && m.tagTitle.toLowerCase().includes("leaving");
                return `
                  <div class="glass-sub model-row">
                    <div class="model-row-left">
                      <div class="model-row-name">
                        <span>${esc(m.label)}</span>
                        ${m.tagTitle ? `<span class="m-chip-tag ${warn ? "warn" : ""}">${esc(m.tagTitle)}</span>` : ""}
                      </div>
                      <div class="model-row-desc">${esc(m.tagDescription || m.family)} · 周限额 ${m.weeklyPercent != null ? m.weeklyPercent + "%" : "--"}</div>
                    </div>
                    <span class="win-pct-main tone-${tone}" style="font-size:13px">${m.displayPercent ?? Math.round(m.remainingPercent)}%</span>
                  </div>
                `;
              })
              .join("")}
          </div>
        `
        : "";

      return `
        <div class="glass section-card">
          <div class="sec-header">
            <span class="sec-title">5h 额度消耗趋势</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="sec-note">${history.length} 采样点</span>
              <button class="link-btn" id="btn-clear-hist">清空</button>
            </div>
          </div>
          ${trendChartHtml}
        </div>

        <div class="glass section-card">
          <div class="sec-header">
            <span class="sec-title">全部模型清单 (${models.length})</span>
            <button class="link-btn" id="btn-toggle-models">${state.showAllModels ? "收起列表 ▲" : "展开全部 ▼"}</button>
          </div>
          ${modelsListHtml || `<div class="sec-note">展开可查看全部 ${models.length} 个模型各自的 5h 与周余量。</div>`}
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("root");
      if (!root) return;

      if (state.loading && !state.data) {
        root.innerHTML = `<div class="glass section-card"><div class="sec-note">正在同步官方双窗口额度与当前会话…</div></div>`;
        return;
      }

      const d = state.data;
      if (!d || !d.ok) {
        const err = state.error || d?.error || "暂时无法连接本地服务";
        root.innerHTML = `
          <div class="alert-glass danger" style="justify-content:space-between">
            <span>⚠️ ${esc(err)}</span>
            <button class="glass-btn" id="btn-retry">重试</button>
          </div>
        `;
        document.getElementById("btn-retry")?.addEventListener("click", () => refreshNow());
        return;
      }

      const acc = d.account || {};
      const sum = d.summary || {};
      const pools = d.pools || [];
      const models = d.models || [];
      const history = d.history || [];
      const alerts = d.alerts || [];
      const sess = d.session || {};
      const ctx = sess.context || {};
      const spd = sess.speed || {};

      // Pick focused pool: explicit click > current session's active model pool > first pool
      let focusedPool =
        pools.find((p) => p.id === state.focusedPoolId) ||
        pools.find((p) => p.isCurrentSessionPool) ||
        pools[0] ||
        null;

      const focusedPace = focusedPool?.pace || {};
      const focused5hDisp = focusedPool?.displayPercent ?? 100;
      const focusedWeeklyDisp = focusedPool?.weeklyDisplayPercent;

      const ctxLimit = getEffectiveContextLimit(ctx);
      const ctxActive = ctx.activeTokens || 0;
      const ctxUsedPct = ctxLimit > 0 ? Math.min(100, (ctxActive / ctxLimit) * 100) : 0;
      const isRunning = sess.runState === "RUN_STATE_RUNNING";

      const alertsHtml = alerts
        .map((a) => `<div class="alert-glass ${a.level === "danger" ? "danger" : "warn"}"><span>${a.level === "danger" ? "🚨" : "⚡"}</span><span>${esc(a.text)}</span></div>`)
        .join("");

      const promptVal = acc.availablePromptCredits != null ? Number(acc.availablePromptCredits).toLocaleString() : "--";
      const promptMax = acc.monthlyPromptCredits != null ? `月度 ${Number(acc.monthlyPromptCredits).toLocaleString()}` : "Prompt";
      const flowVal = acc.availableFlowCredits != null ? Number(acc.availableFlowCredits).toLocaleString() : "--";
      const flowMax = acc.monthlyFlowCredits != null ? `月度 ${Number(acc.monthlyFlowCredits).toLocaleString()}` : "Flow";

      let tabBodyHtml = "";
      if (state.activeTab === "quota") {
        tabBodyHtml = `
          <div class="time-strip">
            <div class="glass time-cell">
              <span class="time-lbl">数据更新</span>
              <span class="time-val">${esc(fmtClock(d.fetchedAt))}</span>
            </div>
            <div class="glass time-cell">
              <span class="time-lbl">下次刷新</span>
              <span class="time-val" id="cell-next-refresh">${state.autoRefresh ? `${state.autoSecondsLeft}s` : "已暂停"}</span>
            </div>
            <div class="glass time-cell">
              <span class="time-lbl">最近池重置</span>
              <span class="time-val" data-countdown-iso="${esc(sum.nearestResetTime || "")}">${fmtHumanCountdown(sum.nearestResetTime)}</span>
            </div>
          </div>

          <!-- Dual Concentric Ring Hero (5h Outer + Weekly Inner, synced with View Usage) -->
          <div class="glass hero-card">
            ${renderDualConcentricQuotaRings(focusedPool)}
            <div class="hero-right">
              <div class="hero-head">
                <span class="hero-pool-title">${esc(focusedPool ? focusedPool.name : "模型额度")}</span>
                <span class="pill ${pacePillClass(focusedPace.paceStatus)}">${esc(focusedPace.paceLabel || "正常")}</span>
              </div>
              <div class="hero-kpis">
                <div class="glass-sub kpi-mini">
                  <span class="kpi-mini-lbl"><span style="color:${quotaColor(focusedPool?.remainingPercent ?? 100)}">●</span> 5h 限额</span>
                  <span class="kpi-mini-val tone-${quotaTone(focusedPool?.remainingPercent ?? 100)}">${focused5hDisp}% <small style="font-weight:500;opacity:0.7">(${fmtExactPct(focusedPool?.remainingPercent ?? 100)})</small></span>
                </div>
                <div class="glass-sub kpi-mini">
                  <span class="kpi-mini-lbl"><span style="color:var(--apple-teal)">●</span> 每周限额</span>
                  <span class="kpi-mini-val tone-teal">${focusedWeeklyDisp != null ? `${focusedWeeklyDisp}%` : "--"} ${focusedPool?.weeklyRemainingPercent != null ? `<small style="font-weight:500;opacity:0.7">(${fmtExactPct(focusedPool.weeklyRemainingPercent)})</small>` : ""}</span>
                </div>
                <div class="glass-sub kpi-mini">
                  <span class="kpi-mini-lbl">5h 重置剩余</span>
                  <span class="kpi-mini-val" data-countdown-iso="${esc(focusedPool?.resetTime || "")}">${fmtHumanCountdown(focusedPool?.resetTime)}</span>
                </div>
                <div class="glass-sub kpi-mini">
                  <span class="kpi-mini-lbl">周限额重置</span>
                  <span class="kpi-mini-val" data-countdown-iso="${esc(focusedPool?.weeklyResetTime || "")}">${fmtHumanCountdown(focusedPool?.weeklyResetTime)}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="glass section-card">
            <div class="sec-header">
              <span class="sec-title">全部模型组（与 View Usage 同步）</span>
              <span class="sec-note">点击卡片可切换上方圆环</span>
            </div>
            <div class="pool-list">
              ${pools.map((p) => renderPoolCard(p, focusedPool && p.id === focusedPool.id)).join("")}
            </div>
          </div>

          <div class="credits-grid">
            <div class="glass credit-box">
              <div class="credit-head"><span>Prompt Credits</span><span class="pill pill-blue">AI</span></div>
              <div class="credit-val">${esc(promptVal)}</div>
              <div class="credit-sub">${esc(promptMax)}</div>
            </div>
            <div class="glass credit-box">
              <div class="credit-head"><span>Flow Credits</span><span class="pill pill-blue">Agent</span></div>
              <div class="credit-val">${esc(flowVal)}</div>
              <div class="credit-sub">${esc(flowMax)}</div>
            </div>
          </div>
        `;
      } else if (state.activeTab === "context") {
        tabBodyHtml = renderContextTab(sess);
      } else if (state.activeTab === "speed") {
        tabBodyHtml = renderSpeedTab(sess);
      } else {
        tabBodyHtml = renderTrendAndModelsTab(history, models);
      }

      root.innerHTML = `
        <div class="topbar">
          <div class="title-group">
            <div class="app-squircle" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 14l4-4" />
                <path d="M3.34 19a10 10 0 1 1 17.32 0" />
              </svg>
            </div>
            <div class="title-row">
              <h1>额度与会话</h1>
              <span class="pill pill-blue">${esc(acc.tierName || "Pro")}</span>
            </div>
          </div>

          <div class="actions-row">
            <button class="glass-btn" id="btn-auto" title="切换 15 秒自动同步">
              <span class="live-dot ${isRunning ? "running" : state.autoRefresh ? "" : "paused"}"></span>
              <span id="lbl-auto-sec">${state.autoRefresh ? `${state.autoSecondsLeft}s` : "暂停"}</span>
            </button>
            <button class="glass-btn icon-only" id="btn-refresh" ${state.refreshing ? "disabled" : ""} title="立即刷新">
              <svg class="${state.refreshing ? "spin" : ""}" width="13.5" height="13.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <polyline points="21 3 21 9 15 9" />
              </svg>
            </button>
          </div>
        </div>

        <!-- 3-Unit Live Capsule Strip -->
        <div class="capsule-strip">
          <button class="glass capsule-unit ${state.activeTab === "quota" ? "active-unit" : ""}" data-tab="quota" type="button">
            ${renderMiniDualRingSvg(focusedPool?.remainingPercent ?? 100, focusedPool?.weeklyRemainingPercent, quotaColor(focusedPool?.remainingPercent ?? 100))}
            <div class="capsule-txt">
              <span class="capsule-lbl">${esc(focusedPool ? focusedPool.bucket : "当前池")}</span>
              <span class="capsule-val tone-${quotaTone(focusedPool?.remainingPercent ?? 100)}">${focused5hDisp}%${focusedWeeklyDisp != null ? ` · 周${focusedWeeklyDisp}%` : ""}</span>
            </div>
          </button>

          <button class="glass capsule-unit ${state.activeTab === "context" ? "active-unit" : ""}" data-tab="context" type="button">
            ${renderMiniSingleRingSvg(ctxUsedPct, ctxColor(ctxUsedPct))}
            <div class="capsule-txt">
              <span class="capsule-lbl">当前上下文</span>
              <span class="capsule-val">${fmtCompactTokens(ctxActive)}</span>
            </div>
          </button>

          <button class="glass capsule-unit ${state.activeTab === "speed" ? "active-unit" : ""}" data-tab="speed" type="button">
            <div style="width:24px;height:24px;border-radius:50%;background:var(--pill-blue-bg);color:var(--apple-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px">⚡</div>
            <div class="capsule-txt">
              <span class="capsule-lbl">${isRunning ? "生成中…" : "输出速度"}</span>
              <span class="capsule-val tone-blue">${spd.latestTokPerSec != null ? `${spd.latestTokPerSec}` : "--"} <small style="font-weight:500;font-size:9.5px">t/s</small></span>
            </div>
          </button>
        </div>

        ${alertsHtml}

        <!-- Apple 4-Tab Segmented Control -->
        <div class="segmented" role="tablist">
          <button class="seg-btn ${state.activeTab === "quota" ? "active" : ""}" data-tab="quota">额度</button>
          <button class="seg-btn ${state.activeTab === "context" ? "active" : ""}" data-tab="context">上下文</button>
          <button class="seg-btn ${state.activeTab === "speed" ? "active" : ""}" data-tab="speed">速度</button>
          <button class="seg-btn ${state.activeTab === "trend" ? "active" : ""}" data-tab="trend">趋势</button>
        </div>

        ${tabBodyHtml}

        <div class="footer-meta">
          <span>${esc(acc.name || "当前账户")}${acc.email ? ` · ${esc(acc.email)}` : ""}</span>
          <span>外环 5h · 内环 Weekly</span>
        </div>
      `;

      document.getElementById("btn-refresh")?.addEventListener("click", () => refreshNow());
      document.getElementById("btn-auto")?.addEventListener("click", () => {
        state.autoRefresh = !state.autoRefresh;
        state.autoSecondsLeft = 15;
        render();
      });
      document.getElementById("btn-clear-hist")?.addEventListener("click", () => clearHistory());
      document.getElementById("btn-toggle-models")?.addEventListener("click", () => {
        state.showAllModels = !state.showAllModels;
        render();
      });

      document.getElementById("sel-session")?.addEventListener("change", (e) => {
        state.selectedConversationId = e.target.value || null;
        refreshNow();
      });

      root.querySelectorAll("[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeTab = btn.getAttribute("data-tab");
          render();
        });
      });

      root.querySelectorAll("[data-budget]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.contextBudgetMode = btn.getAttribute("data-budget");
          render();
        });
      });

      root.querySelectorAll("[data-focus-pool]").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target.closest("[data-toggle-pool]")) return;
          state.focusedPoolId = card.getAttribute("data-focus-pool");
          render();
        });
      });

      root.querySelectorAll("[data-toggle-pool]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-toggle-pool");
          if (state.expandedPools.has(id)) state.expandedPools.delete(id);
          else state.expandedPools.add(id);
          render();
        });
      });
    }

    function tickSecond() {
      document.querySelectorAll("[data-countdown-iso]").forEach((el) => {
        el.textContent = fmtHumanCountdown(el.getAttribute("data-countdown-iso"));
      });

      if (state.autoRefresh && !state.refreshing && state.data) {
        state.autoSecondsLeft -= 1;
        const s = `${Math.max(0, state.autoSecondsLeft)}s`;
        const lbl1 = document.getElementById("lbl-auto-sec");
        const lbl2 = document.getElementById("cell-next-refresh");
        if (lbl1) lbl1.textContent = s;
        if (lbl2) lbl2.textContent = s;

        if (state.autoSecondsLeft <= 0) {
          state.autoSecondsLeft = 15;
          refreshNow();
        }
      }
    }

    async function callBackend(action) {
      const convArg = state.selectedConversationId ? { conversationId: state.selectedConversationId } : {};
      if (RUNTIME_MODE === "mcp" && mcpApp) {
        const toolName = action === "clear" ? "clear_quota_history" : "refresh_quota";
        const res = await mcpApp.callServerTool({ name: toolName, arguments: convArg });
        return res?.structuredContent;
      } else {
        const endpoint = action === "clear" ? "/api/clear-history" : "/api/quota";
        const method = action === "clear" ? "POST" : "GET";
        const url = new URL(endpoint, window.location.origin);
        const curParams = new URLSearchParams(window.location.search);
        curParams.forEach((v, k) => url.searchParams.set(k, v));
        if (state.selectedConversationId) {
          url.searchParams.set("conversationId", state.selectedConversationId);
        }
        const resp = await fetch(url.toString(), { method });
        return await resp.json();
      }
    }

    async function refreshNow() {
      if (state.refreshing) return;
      state.refreshing = true;
      state.error = null;
      render();
      try {
        const payload = await callBackend("refresh");
        if (payload) state.data = payload;
      } catch (err) {
        state.error = err?.message || String(err);
      } finally {
        state.loading = false;
        state.refreshing = false;
        state.autoSecondsLeft = 15;
        render();
      }
    }

    async function clearHistory() {
      if (state.refreshing) return;
      state.refreshing = true;
      render();
      try {
        const payload = await callBackend("clear");
        if (payload) state.data = payload;
      } catch (err) {
        state.error = err?.message || String(err);
      } finally {
        state.refreshing = false;
        render();
      }
    }

    async function bootstrap() {
      if (RUNTIME_MODE === "mcp" && typeof __EXT_APPS__ !== "undefined" && __EXT_APPS__) {
        const { App, applyDocumentTheme, applyHostStyleVariables, applyHostFonts } = __EXT_APPS__;
        mcpApp = new App({ name: "quota-monitor", version: "2.2.0" }, {});

        const syncTheme = (ctx) => {
          if (!ctx) return;
          if (ctx.theme) {
            document.documentElement.setAttribute("data-theme", ctx.theme);
            applyDocumentTheme(ctx.theme);
          }
          if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
          if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        };

        mcpApp.ontoolinput = () => {
          if (!state.data) {
            state.loading = true;
            render();
          }
        };

        mcpApp.ontoolresult = (result) => {
          state.loading = false;
          state.refreshing = false;
          if (result?.structuredContent) {
            state.data = result.structuredContent;
          }
          render();
        };

        mcpApp.onhostcontextchanged = (ctx) => syncTheme(ctx);

        try {
          await mcpApp.connect();
          syncTheme(mcpApp.getHostContext());
          setTimeout(() => {
            if (!state.data && !state.refreshing) refreshNow();
          }, 350);
        } catch (err) {
          state.loading = false;
          state.error = `初始化失败: ${err?.message || err}`;
          render();
        }
      } else {
        await refreshNow();
      }

      setInterval(tickSecond, 1000);
    }

    bootstrap();
  </script>
</body>
</html>
